# Opt-in mapping for the NO aircraft definitions in moza_aircraft_database/ and the presets in moza_presets/.
# Paste this over the [aircraft_mapping] section of your zorduzd.cfg (keep [ports]).
# Only use it after installing those definitions and presets; otherwise keep zorduzd's default mapping.
[aircraft_mapping]
# Nuclear Option aircraftName (lowercase, as shown in the zorduzd BepInEx debug window)
#   = aircraft_uid from moza_aircraft_database/
# Several spellings are listed for some aircraft; unused lines are harmless.
# Some aircraft have extra spellings; unused lines are harmless.

